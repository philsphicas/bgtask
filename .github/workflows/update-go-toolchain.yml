name: Update Go Toolchain

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the update without creating or modifying pull requests
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: update-go-toolchain
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # Discover the installed stable release, not a toolchain selected by go.mod.
      GOTOOLCHAIN: local
    steps:
      - name: Select run mode
        id: mode
        env:
          PUBLISH: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == true && "$GITHUB_REF" != "$DEFAULT_REF" ]]; then
            echo "::error::Publishing is only allowed from the default branch. Use dry_run=true to test another branch."
            exit 1
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Test updater
        run: |
          bash .github/scripts/test-update-go-toolchain.sh
          node --test .github/scripts/test-workflow-policy.cjs

      - name: Determine Go update
        id: version
        shell: bash
        run: bash .github/scripts/update-go-toolchain.sh check >> "$GITHUB_OUTPUT"

      - name: Update module metadata
        if: steps.version.outputs.update-available == 'true'
        env:
          LATEST: ${{ steps.version.outputs.latest }}
        run: bash .github/scripts/update-go-toolchain.sh update "$LATEST"

      - name: Remediate vulnerable modules
        run: bash .github/scripts/update-go-toolchain.sh remediate

      - name: Determine changes
        id: changes
        env:
          GO_UPDATE: ${{ steps.version.outputs.update-available }}
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          set -euo pipefail
          if git diff --quiet -- go.mod go.sum; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          title="build: update vulnerable Go modules"
          if [[ "$GO_UPDATE" == true ]]; then
            title="build: update Go toolchain to $LATEST"
          fi
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Require PR token
        if: steps.changes.outputs.changed == 'true' && steps.mode.outputs.publish == 'true'
        env:
          TOKEN: ${{ secrets.GO_TOOLCHAIN_UPDATER_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Set GO_TOOLCHAIN_UPDATER_TOKEN to a GitHub App token or fine-grained PAT with Contents and Pull requests read/write permissions."
            exit 1
          fi

      - name: Test updated module
        if: steps.changes.outputs.changed == 'true'
        run: go test -count=1 ./...

      - name: Preview update
        env:
          PUBLISH: ${{ steps.mode.outputs.publish }}
        run: |
          set -euo pipefail
          git diff --check
          git diff -- go.mod go.sum > "$RUNNER_TEMP/go-toolchain-update.patch"
          {
            echo "## Go and vulnerability update"
            echo
            echo "Publishing enabled: $PUBLISH"
            echo
            if [[ -s "$RUNNER_TEMP/go-toolchain-update.patch" ]]; then
              echo '```diff'
              cat "$RUNNER_TEMP/go-toolchain-update.patch"
              echo '```'
            else
              echo "No update needed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload update preview
        uses: actions/upload-artifact@v7
        with:
          name: go-toolchain-update
          path: ${{ runner.temp }}/go-toolchain-update.patch
          if-no-files-found: error

      - name: Disable existing auto-merge before a feature update
        if: steps.version.outputs.is-patch == 'false' && steps.mode.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GO_TOOLCHAIN_UPDATER_TOKEN }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          number="$(gh pr list --base "$BASE" --head automation/go-toolchain --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh pr merge --disable-auto "$number"
          fi

      - name: Create pull request
        id: pull-request
        if: steps.changes.outputs.changed == 'true' && steps.mode.outputs.publish == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GO_TOOLCHAIN_UPDATER_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: automation/go-toolchain
          delete-branch: true
          commit-message: ${{ steps.changes.outputs.title }}
          title: ${{ steps.changes.outputs.title }}
          body: |
            Updates Go when a newer stable release is available and updates modules
            that `govulncheck` reports as vulnerable with a fix available.

            The resulting module uses an exact Go version with no separate `toolchain`
            directive. Tests and vulnerability checks must pass before publication.

            CI, demos, and release builds use `go-version-file: go.mod`, so they follow
            this update without separate workflow version edits.

            Dependency-only and patch-level Go updates are eligible for auto-merge
            after required checks pass. Go feature releases require review.
          add-paths: |
            go.mod
            go.sum

      - name: Enable auto-merge for patch updates
        if: >
          steps.mode.outputs.publish == 'true' &&
          steps.version.outputs.is-patch != 'false' &&
          steps.pull-request.outputs.pull-request-number != '' &&
          steps.pull-request.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ secrets.GO_TOOLCHAIN_UPDATER_TOKEN }}
          PR_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
          HEAD_SHA: ${{ steps.pull-request.outputs.pull-request-head-sha }}
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_NUMBER"
