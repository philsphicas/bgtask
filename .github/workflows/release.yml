name: Stable Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Validate stable tag
        id: release
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Stable release tags must match vMAJOR.MINOR.PATCH exactly."
            exit 1
          fi

          commit_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$commit_sha" origin/main; then
            echo "::error::Tagged commit ${commit_sha} is not reachable from origin/main."
            exit 1
          fi

          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test tagged commit
        run: go test -count=1 ./...

  release:
    needs: validate
    permissions:
      contents: write
    uses: ./.github/workflows/publish-binaries.yml
    with:
      channel: stable
      version: ${{ needs.validate.outputs.version }}
      commit_sha: ${{ needs.validate.outputs.commit_sha }}
