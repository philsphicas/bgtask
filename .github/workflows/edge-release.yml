name: Edge Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Require newest successful main CI run
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          latest_successful_run="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq ".workflow_runs[0].id"
          )"
          if [[ "$WORKFLOW_RUN_ID" != "$latest_successful_run" ]]; then
            echo "::notice::A newer successful main CI run exists; skipping this stale edge candidate."
            exit 1
          fi

      - name: Set edge version
        id: release
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "version=edge-${COMMIT_SHA:0:12}" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/publish-binaries.yml
    with:
      channel: edge
      version: ${{ needs.prepare.outputs.version }}
      commit_sha: ${{ needs.prepare.outputs.commit_sha }}
